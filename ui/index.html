<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置隐私屏保</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#1b1b1f;
    --sub:#6b6b73;
    --muted:#9a9aa2;
    --line:#e9e9ee;
    --soft:#f5f5f7;
    --accent:#2f6bff;
    --accent-hover:#2a5fe6;
    --radius:10px;
    --gap:13px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;
    user-select:none;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* 内容与 footer 都在滚动容器内，宽度天然一致：
     滚动条占位时卡片与按钮同步收窄，拉伸窗口也对齐 */
  .scroll{
    height:100vh;
    overflow-y:auto;
  }
  .inner{
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding:20px 24px 0;
  }
  .spacer{flex:1 1 auto;min-height:14px;}
  .scroll::-webkit-scrollbar{width:10px;}
  .scroll::-webkit-scrollbar-thumb{background:#dcdce2;border-radius:5px;border:3px solid #fff;}
  .scroll::-webkit-scrollbar-thumb:hover{background:#c8c8d0;}
  .scroll::-webkit-scrollbar-track{background:transparent;}

  .sec{
    font-size:13.5px;
    color:var(--sub);
    margin-bottom:10px;
  }
  .mt{margin-top:22px;}

  /* 自定义块与预设格共用网格定义；16:9 对齐 UU 的卡片比例 */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:var(--gap);
  }
  .custom,.cell{
    aspect-ratio:16/9;
    border-radius:var(--radius);
    position:relative;
    z-index:0;              /* 创建层叠上下文：卡片内的徽章不会盖到 footer 上 */
    overflow:hidden;
    cursor:pointer;
  }

  /* ---------- 自定义上传 ---------- */
  .custom{
    background:var(--soft);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .custom:hover{background:#eeeef3;}
  .custom.active{border:2px solid var(--accent);background:#f3f7ff;}
  .custom .plus{
    width:34px;height:34px;border-radius:50%;
    background:#e3e3ea;color:#8b8b95;
    font-size:19px;font-weight:300;
    line-height:32px;text-align:center;
    margin-bottom:8px;
  }
  .custom.active .plus{background:#d8e3ff;color:var(--accent);}
  .custom .hint{
    font-size:10.5px;color:var(--muted);
    text-align:center;line-height:1.5;
    padding:0 8px;
  }
  .custom img.thumb{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
    display:none;
  }
  .custom.has-img img.thumb{display:block;}
  .custom.has-img .plus,
  .custom.has-img .hint{display:none;}
  .custom .fname{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:14px 8px 6px;
    background:linear-gradient(transparent,rgba(0,0,0,.75));
    color:#fff;font-size:11px;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:none;
  }
  .custom.has-img .fname{display:block;}

  /* ---------- 预设网格 ---------- */
  .cell{
    border:2px solid transparent;
    background:#f0f0f3;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.13);}
  .cell img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;display:block;
  }
  .cell .badge{
    position:absolute;top:0;left:0;z-index:2;
    background:rgba(0,0,0,.8);color:#fff;
    font-size:11.5px;padding:3px 10px;
    border-radius:0 0 8px 0;
    display:none;
  }
  .cell.active{border-color:var(--accent);}
  /* 徽章表示"正在使用"，与选中态（.active）分离 */
  .cell.applied .badge{display:block;}

  /* ---------- 快捷键 ---------- */
  .hk-card{
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 18px;
  }
  .hk-row{
    display:flex;align-items:center;gap:12px;
    padding:9px 0;
  }
  .hk-row + .hk-row{border-top:1px dashed var(--line);}
  .hk-label{width:74px;font-size:13px;flex-shrink:0;}
  .hk-key{
    min-width:170px;height:32px;
    background:#fff;border:1px solid #d0d0d8;border-radius:6px;
    font-family:inherit;font-size:13px;color:var(--text);
    cursor:pointer;text-align:center;
    transition:border-color .15s, background .15s;
  }
  .hk-key:hover{border-color:var(--accent);}
  .hk-key.recording{border-color:var(--accent);background:#f3f7ff;color:var(--accent);}
  .hk-desc{color:var(--muted);font-size:12px;}
  .hk-note{
    margin-top:10px;padding-bottom:8px;
    color:var(--muted);font-size:11.5px;line-height:1.6;
  }
  .hk-note b{color:var(--sub);font-weight:500;}

  /* ---------- 底部（sticky：钉在可视区底部，宽度随卡片同步） ---------- */
  footer{
    position:sticky;
    bottom:0;
    z-index:10;             /* 必须高于卡片内徽章，滚动时才能正确遮住卡片底部 */
    flex:0 0 auto;
    display:flex;gap:12px;
    padding:10px 0 12px;
    margin-top:14px;
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .btn{
    height:36px;
    border-radius:8px;
    font-family:inherit;font-size:13.5px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
  }
  .btn.pri{background:var(--accent);color:#fff;flex:1;}
  .btn.pri:hover{background:var(--accent-hover);}
  .btn.pri:disabled{background:#c3cde3;color:#fff;cursor:not-allowed;}
  .btn.ghost{background:#fff;color:var(--text);border-color:#dcdce3;flex:1;}
  .btn.ghost:hover{background:#f7f7fa;border-color:#c9c9d2;}

  .toast{
    position:fixed;left:50%;bottom:86px;
    transform:translate(-50%,10px);
    background:rgba(28,28,32,.94);
    color:#fff;font-size:12.5px;
    padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;
    max-width:78%;text-align:center;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="scroll">
<div class="inner">
  <div class="sec">自定义</div>
  <div class="grid">
    <div class="custom" id="customBox" onclick="pickImage()">
      <img class="thumb" id="customThumb" alt="">
      <div class="plus">+</div>
      <div class="hint">1920×1080 以上更清晰<br>JPG/PNG/WEBP · ≤2MB</div>
      <div class="fname" id="customName"></div>
    </div>
  </div>

  <div class="sec mt">预设</div>
  <div class="grid" id="grid"></div>

  <div class="sec mt">快捷键</div>
  <div class="hk-card">
    <div class="hk-row">
      <span class="hk-label">开关防窥</span>
      <button class="hk-key" id="hkToggle" onclick="recordHotkey('toggle')">Ctrl+Alt+V</button>
      <span class="hk-desc">开启 / 关闭隐私屏保</span>
    </div>
    <div class="hk-row">
      <span class="hk-label">打开设置</span>
      <button class="hk-key" id="hkSettings" onclick="recordHotkey('settings')">Ctrl+Alt+S</button>
      <span class="hk-desc">打开 / 关闭本面板</span>
    </div>
    <div class="hk-row">
      <span class="hk-label">退出程序</span>
      <button class="hk-key" id="hkQuit" onclick="recordHotkey('quit')">Ctrl+Alt+Shift+Q</button>
      <span class="hk-desc">彻底退出 Veil</span>
    </div>
    <div class="hk-note">
      点击热键框后按下新的组合键即可（须含 Ctrl 或 Alt，支持字母 / 数字 / F1~F12），按 Esc 取消。
      固定兜底键 <b>Ctrl+Alt+Shift+Q</b> 始终可以强制退出，防止热键改坏后屏幕被遮住无法自救。
    </div>
  </div>

  <div class="spacer"></div>

  <footer>
    <button class="btn pri" id="btnApply" onclick="applyEnable()">确定并启用隐私屏保</button>
    <button class="btn ghost" onclick="preview()">预览</button>
  </footer>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
let S = null;

function tip(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), ms||2200);
}

async function boot(){
  try{ S = JSON.parse(await window.goState()); }
  catch(e){ S = {presets:[],presetId:'black',customImage:'',allMonitors:true}; }
  render();
  loadHotkeys();
}

const THUMBS = {}; // id -> dataURI，预加载后切换预设不再触发重新加载

function render(){
  const selCustom = !!S.customImage;          // 选中：自定义图
  const appliedCustom = !!S.appliedCustomImage; // 生效：自定义图

  const box = document.getElementById('customBox');
  box.classList.toggle('active', selCustom);
  box.classList.toggle('has-img', selCustom);
  if(selCustom){
    document.getElementById('customName').textContent = S.customName || '';
    window.goCustomThumb().then(t => {
      if (t) document.getElementById('customThumb').src = t;
    });
  }

  // 只在预设列表变化时重建 DOM；仅切换选中项时只改 class（否则图片重载会闪烁）
  const grid = document.getElementById('grid');
  if (grid.childElementCount !== (S.presets||[]).length) {
    grid.innerHTML = '';
    (S.presets||[]).forEach(p=>{
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.id = p.id;
      el.innerHTML = '<img alt=""><span class="badge">正在使用</span>';
      el.onclick = ()=>choose(p);
      grid.appendChild(el);
      loadThumb(p.id, el.querySelector('img'));
    });
  }
  // 选中态（细边框）与生效态（徽章）分开处理。
  // 遮罩开着 → "正在使用"；遮罩关着 → "上次使用"（此刻没有东西在"使用中"）
  const appliedLabel = S.overlayOn ? '正在使用' : '上次使用';
  Array.from(grid.children).forEach(el=>{
    const selected = !selCustom && S.presetId === el.dataset.id;
    const applied  = !appliedCustom && S.appliedPresetId === el.dataset.id;
    el.classList.toggle('active', selected);
    el.classList.toggle('applied', applied);
    if (applied) el.querySelector('.badge').textContent = appliedLabel;
  });

  updateApplyButton();
}

function loadThumb(id, img){
  if (THUMBS[id]) { img.src = THUMBS[id]; return; }
  window.goThumb(id).then(t => {
    if (!t) return;
    THUMBS[id] = t;   // 缓存到内存，后续切换零延迟
    img.src = t;
  });
}

// 确认按钮：只有"选中 ≠ 生效"或"遮罩没开"时才可点
function updateApplyButton(){
  const btn = document.getElementById('btnApply');
  if(!btn) return;
  const selKey = S.customImage ? 'c|' + S.customImage : 'p|' + S.presetId;
  const appKey = S.appliedCustomImage ? 'c|' + S.appliedCustomImage : 'p|' + S.appliedPresetId;
  const dirty = selKey !== appKey;      // 选中的不是正在使用的
  btn.disabled = !(dirty || !S.overlayOn);
}

// 遮罩开关等外部状态变化时由后端调用：重新拉状态并增量渲染
async function refreshState(){
  try{ S = JSON.parse(await window.goState()); }catch(e){ return; }
  render();
}

async function choose(p){
  await window.goSetPreset(p.id);
  S.presetId = p.id;
  S.customImage = '';
  S.customName = '';
  render();
}

async function pickImage(){
  const raw = await window.goPickImage();
  if(!raw) return;
  let r; try{ r = JSON.parse(raw); }catch(e){ return; }
  if(r.error){ tip(r.error, 3800); return; }
  S.customImage = r.path;
  S.customName = r.name;
  S.customThumb = r.thumb || '';
  render();
  // 分辨率不再是硬限制：低分辨率照样能用，只提示放大后的观感
  if(r.low){ tip('图片 '+r.dims+' 低于 1920×1080，铺满屏幕会放大略模糊', 4500); }
  else { tip('自定义图片已设置'); }
}

async function applyEnable(){
  await window.goApplyEnable();
}

async function preview(){
  tip('正在物理屏幕试放 2.5 秒…', 2600);
  await window.goPreview();
}

/* ---------- 快捷键 ---------- */

async function loadHotkeys(){
  try{
    const hk = JSON.parse(await window.goGetHotkeys());
    document.getElementById('hkToggle').textContent = hk.toggle;
    document.getElementById('hkSettings').textContent = hk.settings;
    document.getElementById('hkQuit').textContent = hk.quit;
  }catch(e){}
}

let recording = null;

function recordHotkey(kind){
  if(recording) return;
  recording = kind;
  const btn = document.getElementById(kind==='toggle'?'hkToggle':(kind==='settings'?'hkSettings':'hkQuit'));
  btn.textContent = '按下新的组合键…（Esc 取消）';
  btn.classList.add('recording');

  const handler = (e)=>{
    e.preventDefault(); e.stopPropagation();
    if(e.key === 'Escape'){ end(); return; }
    const code = e.code;
    let main = null;
    if(/^Key[A-Z]$/.test(code)) main = code.slice(3);
    else if(/^Digit[0-9]$/.test(code)) main = code.slice(5);
    else if(/^F([1-9]|1[0-2])$/.test(code)) main = code;
    if(!main) return; // 忽略单独的修饰键
    if(!(e.ctrlKey || e.altKey)){
      tip('组合必须包含 Ctrl 或 Alt', 3000);
      return;
    }
    const parts = [];
    if(e.ctrlKey) parts.push('Ctrl');
    if(e.altKey)  parts.push('Alt');
    if(e.shiftKey) parts.push('Shift');
    if(e.metaKey) parts.push('Win');
    parts.push(main);
    const combo = parts.join('+');
    end();
    submitHotkey(kind, combo);
  };
  const end = ()=>{
    window.removeEventListener('keydown', handler, true);
    recording = null;
    btn.classList.remove('recording');
    loadHotkeys();
  };
  window.addEventListener('keydown', handler, true);
}

async function submitHotkey(kind, combo){
  const raw = await window.goSetHotkey(kind, combo);
  let r; try{ r = JSON.parse(raw); }catch(e){ r = {error:'返回格式异常'}; }
  if(r.error){
    tip(r.error, 4000);
  }else{
    tip('快捷键已更新为 ' + combo);
    loadHotkeys(); // 保存完成后刷新，显示才会跟上
  }
}

window.addEventListener('DOMContentLoaded', boot);
window.addEventListener('contextmenu', e=>e.preventDefault());
</script>
</body>
</html>
